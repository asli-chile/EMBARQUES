<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASLI Embarques</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #11224e;
        --teal: #007a7b;
        --cream: #f7f5f2;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: var(--cream);
        color: var(--ink);
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(420px, 100%);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: rgba(17, 34, 78, 0.72);
        line-height: 1.5;
      }
      .spin {
        width: 28px;
        height: 28px;
        margin: 20px auto 0;
        border: 3px solid rgba(0, 122, 123, 0.2);
        border-top-color: var(--teal);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ASLI Embarques</h1>
      <p>Cargando el ERP…</p>
      <div class="spin" aria-hidden="true"></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
